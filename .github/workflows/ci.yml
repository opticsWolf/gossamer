name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      # maturin 1.x requires an active virtualenv for `develop`; create one
      # explicitly (setup-python alone does not provide one).
      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./.venv/bin/pip install maturin
          ./.venv/bin/pip install -r requirements.txt

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          .venv\Scripts\pip.exe install maturin
          .venv\Scripts\pip.exe install -r requirements.txt

      - name: Build Rust core (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./.venv/bin/activate
          maturin develop --release

      - name: Build Rust core (Windows)
        if: runner.os == 'Windows'
        run: |
          .venv\Scripts\Activate.ps1
          maturin develop --release

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./.venv/bin/pip install pytest pytest-asyncio
          ./.venv/bin/pytest tests/ -v --tb=short

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          .venv\Scripts\pip.exe install pytest pytest-asyncio
          .venv\Scripts\pytest.exe tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install Python linting tools
        run: pip install "ruff==0.16.4"

      - name: Run ruff
        run: ruff check stitch_web_researcher/

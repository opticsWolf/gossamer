[package]
name = "gossamer-core"
version = "0.11.1"
edition = "2021"
description = "Rust parsing core for the gossamer LLM web researcher (PyO3)"
authors = ["opticsWolf"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/opticsWolf/gossamer"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
gossamer = { package = "gossamer-web", path = "rust/core" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py38"] }
sha2 = "0.10"
regex = "1"
unicode-normalization = "0.1"
roxmltree = "0.20"
tokio = { version = "1", features = ["full"] }
# rustls-tls (not native-tls): zero system dependencies, so the Linux
# manylinux wheels build without OpenSSL dev files and install without
# a system libssl. Feature set mirrors the old defaults + our codecs.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "brotli", "gzip", "deflate", "cookies", "charset", "http2", "rustls-tls"] }
scraper = "0.22"
html2md = "0.2"
url = "2.5"
tracing = "0.1"
log = "0.4"
tiktoken-rs = "0.12.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde = "1.0.229"
quick-xml = "0.42.0"

[profile.release]
strip = true   # Remove debug symbols
lto = true     # Link-time optimization

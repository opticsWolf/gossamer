[package]
name = "_stitch_web_researcher_core"
version = "0.2.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py38"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "brotli", "gzip", "deflate"] }
scraper = "0.22"
html2md = "0.2"
url = "2.5"
tracing = "0.1"

[profile.release]
strip = true   # Remove debug symbols
lto = true     # Link-time optimization

[package]
name = "gossamer-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"
description = "One-shot browser_oxide sidecar for gossamer browser rendering"

[[bin]]
name = "gossamer-browser"
path = "src/main.rs"

[dependencies]
browser_oxide = "0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "time"] }
url = "2"

[workspace]

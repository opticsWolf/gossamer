[package]
name = "text-links-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"
description = "Rust port of `gossamer/text_links.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
gossamer = { package = "gossamer-web", path = "../core" }
port-error = { path = "../port-error" }
pyo3 = { version = "0.30", features = ["abi3-py39"] }

profile = { release.lto = true, release.codegen-units = 1 }
dev-dependencies = { trycmd = "1" }
[package]
name = "gossamer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"
description = "`gossamer` in Rust, lifted by rust-anything from its front door"

[[bin]]
name = "gossamer"
path = "src/main.rs"

[dependencies]
clap = "4"
gossamer = { package = "gossamer-web", path = "../core" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
audit-cargo-rs = { path = "../audit-cargo-rs", default-features = false }
benchmarks-rs = { path = "../benchmarks-rs", default-features = false }
skills-rs = { path = "../skills-rs", default-features = false }
verify-bundled-assets-rs = { path = "../verify-bundled-assets-rs", default-features = false }

[package]
name = "verify-bundled-assets-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"
description = "Rust port of `scripts/verify_bundled_assets.py`, generated by rust-anything"


[dependencies]
flate2 = "1"
port-error = { path = "../port-error" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
tar = "0.4"
zip = "2"

[package]
name = "gossamer-web"
version = "0.11.1"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"
description = "Pure Rust web research/extraction core for gossamer; no Python bindings"

[lib]
name = "gossamer"
path = "src/lib.rs"

[dependencies]
blake2 = "0.11"
html2md = "0.2"
log = "0.4"
meta_oxide = { path = "vendor/meta_oxide", default-features = false }
pdf_oxide = { version = "0.3.78", default-features = false }
quick-xml = "0.42.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "brotli", "gzip", "deflate", "cookies", "charset", "http2", "rustls-tls"] }
scraper = "0.22"
regex = "1"
roxmltree = "0.20"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["full"] }
unic-ucd-category = "0.9"
unicode-normalization = "0.1"
url = "2.5"

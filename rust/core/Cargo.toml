[package]
name = "gossamer-web"
version = "0.11.1"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"
description = "Pure Rust web research/extraction core for gossamer; no Python bindings"

[lib]
name = "gossamer"
path = "src/lib.rs"

[dependencies]
blake2 = "0.11"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tiktoken-rs = "0.12"
unicode-normalization = "0.1"
url = "2.5"

[lints]
workspace = true

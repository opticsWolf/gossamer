[package]
name = "documents-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `gossamer/structured_parser.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde = "1"
gossamer = { package = "gossamer-web", path = "../core" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

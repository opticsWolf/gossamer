[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "stitch-web-researcher"
version = "0.1.6"
requires-python = ">=3.9"
description = "High-Performance LLM Web Researcher — Rust core, Oxide extractors, multi-provider search, token-aware truncation"
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
authors = [
    {name = "stitch-web-researcher contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]
keywords = ["web-scraping", "llm", "agent", "search", "extraction", "rust", "pyo3"]

[project.urls]
Homepage = "https://github.com/stitch-crawler/stitch_crawler"
Repository = "https://github.com/stitch-crawler/stitch_crawler"
Changelog = "https://github.com/stitch-crawler/stitch_crawler/releases"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]

[project.scripts]
stitch-web-researcher-mcp = "stitch_web_researcher.mcp_server:main"

[tool.maturin]
module-name = "stitch_web_researcher._core"
python-packages = ["stitch_web_researcher"]
manifest-path = "Cargo.toml"
include = [
    "stitch_web_researcher/__init__.py",
    "stitch_web_researcher/agent_tools.py",
    "stitch_web_researcher/search_providers.py",
    "stitch_web_researcher/structured_parser.py",
    "stitch_web_researcher/token_budget.py",
    "stitch_web_researcher/meta_extractor.py",
    "stitch_web_researcher/mcp_server.py",
]

# Pin the lint selection so `ruff check` behaves identically across ruff
# releases (ruff 0.16+ broadened its implicit default ruleset, which would
# otherwise turn every future ruff upgrade into a CI red).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-m 'not slow'"
markers = [
  "slow: slow/integration tests (live network, real browser); run with -m slow",
]

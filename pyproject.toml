[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "stitch-web-researcher"
version = "0.1.34"
requires-python = ">=3.10"
description = "High-Performance LLM Web Researcher — Rust core, Oxide extractors, multi-provider search, token-aware truncation"
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
authors = [
    {name = "stitch-web-researcher contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]
keywords = ["web-scraping", "llm", "agent", "search", "extraction", "rust", "pyo3"]

dependencies = [
    # Core runtime dependencies (import-time or primary call paths).
    "httpx>=0.27",
    "pydantic>=2.7",
    "tiktoken>=0.5",
    "ddgs>=2.0",
    # Rust-backed extractors (same ecosystem as the _core module).
    "meta-oxide>=0.1",
    "browser-oxide>=0.1",
]

[project.urls]
Homepage = "https://github.com/opticsWolf/stitch-web-researcher"
Repository = "https://github.com/opticsWolf/stitch-web-researcher"
Changelog = "https://github.com/opticsWolf/stitch-web-researcher/releases"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
# PDF/Office extraction; the package imports fine without them, but
# extract_document / extract_document_structured require this extra.
documents = [
    "pdf-oxide>=0.1",
    "office-oxide>=0.1",
]

[project.scripts]
stitch-web-researcher-mcp = "stitch_web_researcher.mcp_server:main"

[tool.maturin]
module-name = "stitch_web_researcher._core"
# python-packages includes the ENTIRE package directory in the wheel,
# so no `include` block is needed — and an explicit file list here was
# a live trap (it lagged new modules like cache.py / robots.py / ssrf.py).
python-packages = ["stitch_web_researcher"]
manifest-path = "Cargo.toml"

# Pin the lint selection so `ruff check` behaves identically across ruff
# releases (ruff 0.16+ broadened its implicit default ruleset, which would
# otherwise turn every future ruff upgrade into a CI red).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-m 'not slow'"
markers = [
  "slow: slow/integration tests (live network, real browser); run with -m slow",
]

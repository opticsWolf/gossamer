[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gossamer"
version = "0.8.2"
requires-python = ">=3.10"
description = "High-Performance LLM Web Researcher — Rust core, Oxide extractors, multi-provider search, token-aware truncation"
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
authors = [
    {name = "gossamer contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]
keywords = ["web-scraping", "llm", "agent", "search", "extraction", "rust", "pyo3"]

dependencies = [
    # Core runtime dependencies (import-time or primary call paths).
    "httpx>=0.27",
    "pydantic>=2.7",
    "tiktoken>=0.5",
    "ddgs>=2.0",
    # Rust-backed extractors (same ecosystem as the _core module).
    # meta-oxide: the PyPI releases (0.1.0/0.1.1) ship a broken sdist
    # (missing python source -> maturin build fails on clean machines) and
    # the only wheel is cp314-manylinux. The fork below contains the
    # packaging fix (commit 81bdb53, v0.1.2). When 0.1.2 is published to
    # PyPI, switch this back to "meta-oxide>=0.1.2" (direct references also
    # make THIS project un-publishable to PyPI until then).
    "meta-oxide @ git+https://github.com/opticsWolf/meta_oxide.git@81bdb53",
]

[project.urls]
Homepage = "https://github.com/opticsWolf/gossamer"
Repository = "https://github.com/opticsWolf/gossamer"
Changelog = "https://github.com/opticsWolf/gossamer/releases"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
# Stealth headless rendering fallback (fetch_smart_page / use_smart=True).
# Not a hard dependency: PyPI has no Linux wheels for browser-oxide, and the
# code degrades gracefully to the static fetch path when it is absent.
browser = ["browser-oxide>=0.1"]
# PDF/Office extraction; the package imports fine without them, but
# extract_document / extract_document_structured require this extra.
documents = [
    "pdf-oxide>=0.1",
    "office-oxide>=0.1",
]
# §7: optional prompt-injection guard (JailGuard ONNX detector). The package
# imports and runs without it; only an enabled guard needs the model.
guard = ["jailguard>=0.1.2"]
# Optional CSL rendering for APA/MLA (citeproc-py + bundled styles). NOT a
# hard dependency: citeproc is imported lazily inside gossamer
# .citations, and to_apa / to_mla fall back to the pure-Python approximation
# when the extra is absent. citeproc-py is purely local (no network), so the
# APA path stays testable offline. six is citeproc-py's runtime dep.
citations = ["citeproc-py>=0.11", "citeproc-py-styles>=0.1.6", "six>=1.16"]

[project.scripts]
gossamer-mcp = "gossamer.mcp_server:main"
gossamer = "gossamer.cli:main"
# Legacy alias from the stitch-web-researcher era; harmless to keep.
stitch-web-researcher-mcp = "gossamer.mcp_server:main"

[tool.maturin]
module-name = "gossamer._core"
# python-packages includes the ENTIRE package directory in the wheel,
# so no `include` block is needed — and an explicit file list here was
# a live trap (it lagged new modules like cache.py / robots.py / ssrf.py).
python-packages = ["gossamer"]
manifest-path = "Cargo.toml"

# Pin the lint selection so `ruff check` behaves identically across ruff
# releases (ruff 0.16+ broadened its implicit default ruleset, which would
# otherwise turn every future ruff upgrade into a CI red).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
# Parallel by default via pytest-xdist (`-n auto`); run serially with
# `-p no:xdist`. `-m 'not slow'` keeps the live-network suite out of the default.
addopts = "-n auto -m 'not slow'"
markers = [
  "slow: slow/integration tests (live network, real browser); run with -m slow",
]
